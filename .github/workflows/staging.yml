name: Build Changed Microservices

on:
  push:
    branches:
      - staging

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:

  # ==========================================================
  # JOB 1: DETECT CHANGED MICROSERVICES
  # ==========================================================

  detect-changes:

    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.detect.outputs.services }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        shell: bash
        run: |

          echo "Checking changed files..."

          git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}"

          echo ""
          echo "Detecting changed microservices..."

          SERVICES=$(
            git diff --name-only \
              "${{ github.event.before }}" \
              "${{ github.sha }}" |
            awk -F/ '
              NF >= 2 &&
              $1 ~ /^(product-service|order-service|user-service)$/ {
                print $1
              }
            ' |
            sort -u
          )

          echo ""
          echo "Changed services:"
          echo "$SERVICES"

          JSON=$(
            echo "$SERVICES" |
            jq -R -s -c '
              split("\n")
              | map(select(length > 0))
            '
          )

          echo ""
          echo "Matrix:"
          echo "$JSON"

          echo "services=$JSON" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # JOB 2: MAVEN BUILD + DOCKER BUILD + DOCKER PUSH
  # ==========================================================

  build-and-push:

    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    strategy:

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Java 17 + Maven Cache
      # ------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ------------------------------------------------------
      # Maven Build
      # ------------------------------------------------------

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          mvn -B clean package -DskipTests


      # ------------------------------------------------------
      # Setup Docker Buildx
      # ------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Docker Login
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ------------------------------------------------------
      # Build Docker Image + Push
      # ------------------------------------------------------

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:

          # Directory containing Dockerfile and target/app.jar
          context: ./${{ matrix.service }}

          # Dockerfile
          file: ./${{ matrix.service }}/Dockerfile

          # Push image after successful build
          push: true

          # Image name and immutable Git SHA tag
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

          # Docker Buildx cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
